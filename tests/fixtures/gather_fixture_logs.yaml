# The log fixture: a second, small cluster for the Go capture harness
# (contract/capture/kv_capture_test.go.txt) and the Python byte-equal gather test.
# The main fixture, gather_fixture.yaml, spends all 8 reads before it reaches a
# crashed container. Here most reads are log reads, so the gather's log loop is
# compared too. It uses the main fixture's keys and format. The top-level keys:
#   kubeagent       the kubeagent tag and commit the Go dumps were captured from.
#   summary         the CPU and memory summary the prompt prints (resources.Summary).
#   platform_line   the prompt's platform line; empty means none.
#   service_issues  the service issues the prompt prints (svchealth.Issue); none here.
#   nodes           every node: its name, what the scan saw (scan_reason) and what a fresh describe finds (fresh).
#   pvcs            every broken PVC; none here.
#   workloads       every workload in file order (not report order): pods, findings, events and log text.
#
# All 3 nodes are healthy and unnamed, so T = max(3, 0 + 1) = 3 and the cluster is Healthy.
# No workload has a node, PVC or registry candidate: every read is an events read or a log read.
# A workload's pod is its events pod: the first finding's pod name, else the workload name.
# A workload's events are what a read of its events pod returns, as [reason, message, count].
# A finding's log is the previous-instance log text the API server serves; log_read is the body
# kubeagent makes of it (a Go self-check keeps the two in step). An empty log is served as an
# empty body. log_refused: true makes the server answer 403 for that container's log instead.
#
# What the gather does, in report order (8 reads):
#   shop/api       events (32 events, over 4 KiB: cut on a line), app log (a cause; the line holds
#                  an IP address), app again (deduped), metrics-proxy log (no classifiable output),
#                  and an OOMKilled finding with no container (skip).
#   shop/cart      events, a ProbeFailure (skip: not crash-family), migrate log (a cause).
#   shop/checkout  events, checkout-0 log (refused), checkout-1 log (empty body: no previous log),
#                  then checkout-2 (budget: 8 reads spent).
#   shop/search    budget: the gather never reaches it.

kubeagent:
  tag: "v1.24.0"
  commit: "15ec5649bbd2d07558eae945b71430afc8f231fd"

summary:
  cpu:
    allocatable: "6"
    requests: "4200m"
    requests_pct: 70
    limits: "5400m"
    limits_pct: 90
  memory:
    allocatable: "12Gi"
    requests: "9Gi"
    requests_pct: 75
    limits: "11Gi"
    limits_pct: 91
  metrics_available: false

platform_line: ""

service_issues: []

nodes:
  - name: "worker-1"
    scan_reason: ""
    fresh:
      how: "read"
      ready: "True"
  - name: "worker-2"
    scan_reason: ""
    fresh:
      how: "read"
      ready: "True"
  - name: "worker-3"
    scan_reason: ""
    fresh:
      how: "read"
      ready: "True"

pvcs: []

workloads:
  - namespace: "shop"
    name: "cart"
    kind: "Deployment"
    ready: 0
    desired: 1
    status: "Degraded"
    restarts: 6
    pod: "cart-6b8f5d7c4-r9t3w"
    pods:
      - {name: "cart-6b8f5d7c4-r9t3w", node: "worker-2", claims: []}
    findings:
      - pod: "shop/cart-6b8f5d7c4-r9t3w"
        issue: "ProbeFailure"
        reason: "the readiness probe keeps failing — the pod is kept out of Service endpoints"
        evidence: 'container "app": readiness — HTTP 503'
        container: "app"
        image: ""
      - pod: "shop/cart-6b8f5d7c4-r9t3w"
        issue: "ContainerStartError"
        reason: "the container image was resolved but the container could not be started"
        evidence: 'container "migrate": RunContainerError: exec: "/usr/local/bin/migrate": executable file not found in $PATH'
        container: "migrate"
        image: ""
        log: |
          exec: "/usr/local/bin/migrate": executable file not found in $PATH
        log_read: "log cause: bad command or entrypoint"
    events:
      - ["Unhealthy", "Readiness probe failed: HTTP probe failed with statuscode: 503", 41]
      - ["Failed", 'Error: failed to start container "migrate": exec: "/usr/local/bin/migrate": executable file not found in $PATH', 6]
      - ["BackOff", "Back-off restarting failed container migrate in pod cart-6b8f5d7c4-r9t3w", 18]
    events_failed: ""
    decoy_events: []

  - namespace: "shop"
    name: "checkout"
    kind: "StatefulSet"
    ready: 0
    desired: 3
    status: "Degraded"
    restarts: 31
    pod: "checkout-0"
    pods:
      - {name: "checkout-0", node: "worker-1", claims: []}
      - {name: "checkout-1", node: "worker-2", claims: []}
      - {name: "checkout-2", node: "worker-3", claims: []}
    findings:
      - pod: "shop/checkout-0"
        issue: "CrashLoopBackOff"
        reason: "Container repeatedly crashes after starting"
        evidence: 'container "app", restartCount=14'
        container: "app"
        image: ""
        log: ""
        log_refused: true
        log_read: "reading the previous log of shop/checkout-0 was refused: this identity lacks the pods/log get permission"
      - pod: "shop/checkout-1"
        issue: "OOMKilled"
        reason: "Container exceeded its memory limit and was killed"
        evidence: 'container "app", exitCode=137'
        container: "app"
        image: ""
        log: ""
        log_read: 'no previous-instance log for shop/checkout-1 container "app" (nothing was refused; the container may not have restarted)'
      - pod: "shop/checkout-2"
        issue: "CrashLoopBackOff"
        reason: "Container repeatedly crashes after starting"
        evidence: 'container "app", restartCount=9'
        container: "app"
        image: ""
        log: |
          listening on port 8080
          received SIGTERM, draining connections
          drain timed out after 30s, exiting with code 1
        log_read: "log cause: last output before exit (no signature in the last 25 lines)"
    events:
      - ["BackOff", "Back-off restarting failed container app in pod checkout-0", 27]
    events_failed: ""
    decoy_events: []

