    name: "aux-0"
    scan_reason: "ProvisioningFailed"
    fresh:
      how: "read"
      phase: "Bound"
      storage_class: "fast-ssd"
      volume: "pv-0442"
  - namespace: "db"
    name: "aux-1"
    scan_reason: "ProvisioningFailed"
    fresh:
      how: "read_failed"
      message: 'persistentvolumeclaims "aux-1" is forbidden'
  - namespace: "db"
    name: "aux-2"
    scan_reason: "ProvisioningFailed"
    fresh:
      how: "read"
      phase: "Pending"
      storage_class: "fast-ssd"
      volume: ""
  - namespace: "db"
    name: "data-0"
    scan_reason: "FailedBinding"
    fresh:
      how: "read"
      phase: "Lost"
      storage_class: "fast-ssd"
      volume: "pv-0821"
  - namespace: "store"
    name: "cache-0"
    scan_reason: "ProvisionerNotResponding"
    fresh:
      how: "read"
      phase: "Pending"
      storage_class: "standard"
      volume: ""
  - namespace: "store"
