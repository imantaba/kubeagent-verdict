# One cluster that the Go capture harness (contract/capture/kv_capture_test.go.txt)
# and the Python byte-equal gather test both load. The top-level keys:
#   kubeagent       the kubeagent tag and commit the Go dumps were captured from.
#   summary         the CPU and memory summary the prompt prints (resources.Summary).
#   platform_line   the prompt's platform line; empty means none.
#   service_issues  the service issues the prompt prints (svchealth.Issue).
#   nodes           every node: its name, what the scan saw (scan_reason) and what a fresh describe finds (fresh).
#   pvcs            every broken PVC: namespace, name, the scan's reason and what a fresh describe finds.
#   workloads       every workload in file order (not report order): pods, findings, events and log text.
#
# A node's scan_reason is "NotReady", "no kubelet lease", or "" for a healthy node.
# A fresh block uses the field names of kubeagent_verdict.dataset.objects.Fresh.
# A workload's pod is its events pod: the first finding's pod name, else the workload name.
# A workload's events are what a read of its events pod returns, as [reason, message, count];
# events_failed, when set, is the message of a refused events read instead.
# decoy_events are events of other objects in the same namespace. The events read must not return them.
# A finding's log is the previous-instance log text the API server serves; log_read is the body
# kubeagent makes of it (a Go self-check keeps the two in step).

kubeagent:
  tag: "v1.24.0"
  commit: "15ec5649bbd2d07558eae945b71430afc8f231fd"

summary:
  cpu:
    allocatable: "6"
    requests: "4200m"
    requests_pct: 70
    limits: "5400m"
    limits_pct: 90
  memory:
    allocatable: "12Gi"
    requests: "9Gi"
    requests_pct: 75
    limits: "11Gi"
    limits_pct: 91
  metrics_available: false

platform_line: ""

service_issues:
  - namespace: "shop"
    name: "api"
    type: "NoReadyEndpoints"
    detail: "service has 0 ready endpoints"

nodes:
  - name: "worker-1"
    scan_reason: "NotReady"
    fresh:
      how: "read"
      ready: "False"
      ready_reason: "KubeletNotReady"
      ready_message: "container runtime is down"
      taints:
        - ["node.kubernetes.io/not-ready", "", "NoSchedule"]
  - name: "worker-2"
    scan_reason: "no kubelet lease"
    fresh:
      how: "read"
      ready: "True"
  - name: "worker-4"
    scan_reason: ""
    fresh:
      how: "read"
      ready: "True"
  - name: "worker-7"
    scan_reason: "NotReady"
    fresh:
      how: "read_failed"
      message: 'nodes "worker-7" is forbidden'

pvcs:
