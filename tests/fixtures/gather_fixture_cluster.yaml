# The cluster fixture: a third small cluster for the Go capture harness
# (contract/capture/kv_capture_test.go.txt, mode cluster) and the Python byte-equal
# gather test. It exists for the cluster-health block and the service block of the
# prompt. It uses the main fixture's keys and format, plus the optional keys below.
# The top-level keys:
#   kubeagent         the kubeagent tag and commit the Go dumps were captured from.
#   summary           the CPU and memory summary the prompt prints (resources.Summary).
#   platform_line     the prompt's platform line; empty means none.
#   service_issues    empty here. In this mode the harness computes the service issues
#                     from the four lists below, as scan does.
#   nodes             16 nodes, n01 to n16, each with the conditions the scan saw.
#   pvcs              none.
#   workloads         every workload in file order (not report order): pods, findings, events.
#   services          each Service: namespace, name, type, selector, annotations, lb_ingress.
#   endpoint_slices   per Service, one entry per address: "true", "false" or "unset".
#   backends          the controllers that back a Service: kind, labels and desired count.
#   network_policies  each policy and the pod labels it selects.
#
# Optional keys on a node: conditions (type, status, reason, message, in the order
# the scan listed them), unschedulable (cordoned), lease ("renewed", "missing" or
# "no_renew") and lease_age_ms (how long ago a renewed lease was renewed).
# When a node has conditions, its scan_reason is the reason kubeagent must give it in
# its down-node list ("NotReady", "no kubelet lease", "kubelet not heartbeating"),
# or "" for a node that is not down. The fresh block uses the field names of
# kubeagent_verdict.dataset.objects.Fresh.
# Optional keys on a pod: labels and ready.
#
# The clock is 2026-09-26 12:00 UTC and the lease threshold is 40 seconds.
#   n01..n04  NotReady, four ways: a long message (130 runes, an e-acute at rune 115),
#             Ready Unknown, no reason, and no Ready condition at all.
#   n05, n06  no kubelet lease: no Lease object, and a Lease with no renew time.
#   n07..n11  Ready, lease too old: 40s, 43s, 1m35s, 1h0m0s and 1h1m40s stale.
#   n12       Ready, lease 40.000s old: not past the threshold, so not down.
#   n13       MemoryPressure and PIDPressure.
#   n14       cordoned.
#   n15       DiskPressure, NotReady and cordoned.
#   n16       three node-problem-detector conditions that kubeagent does not read.
# That is 12 down nodes, more than the 8 candidates the prompt keeps per workload.
#
# Workloads. Every flagged workload has the same priority, so the scope is the first
# 10 in namespace order: app/cart, app/web, then kube-system's first eight. Three
# kube-system workloads (ks-f, ks-job, ks-sts) fall past the 10, and their system
# lines still print. app/cart runs on n15, which is the 12th candidate, so its
# attribution is cut from the prompt. The svc namespace holds the Services' pods in
# healthy workloads that are never flagged.
#
# Services s01..s13 are one per wording of the service detail. The prompt keeps the
# first 10, so s11, s12 and s13 are in the fixture but not in the prompt.

